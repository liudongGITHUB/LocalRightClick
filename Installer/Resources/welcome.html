<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;color:#222;line-height:1.65;padding:14px}h1{font-size:24px}li{margin:9px 0}</style><body><h1>安装轻右键</h1><p>在 Finder 右键菜单中新建文件、打开应用、复制路径，以及快速访问常用目录。</p><ul><li>支持 macOS 12 及以上，包括 Intel 和苹果芯片 Mac。</li><li>自动安装到“应用程序”，无需手动拖拽。</li><li>更新前请退出轻右键，并等待正在进行的文件操作完成。</li><li>已有模板、菜单设置和常用目录会保留。</li></ul><p>点击“继续”开始。</p></body></html>

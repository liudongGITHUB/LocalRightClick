<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font:14px -apple-system,sans-serif;color:#222;line-height:1.65;padding:14px}h1{font-size:24px}li{margin:9px 0}</style><body><h1>轻右键已安装</h1><ol><li>在“应用程序”中打开“轻右键”。</li><li>进入“通用设置 → 管理扩展…”，启用轻右键的 Finder 扩展。</li><li>在“新建文件”中勾选需要的类型；勾选“主菜单”可直接显示在右键第一层。</li><li>如需登录后自动启动，在“通用设置”中勾选“登录时启动”。</li></ol><p>设置会自动保存。无需重启电脑。</p></body></html>
